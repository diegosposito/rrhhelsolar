services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: rrhh-elsol-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rrhh

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Local port. The production overlay removes this publish; the proxy fronts it.
      - "${WEB_PORT:-8082}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rrhh

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rrhh
      MYSQL_USER: rrhh
      MYSQL_PASSWORD: rrhh
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      # Atado a 127.0.0.1 a propósito: la base queda accesible desde el propio
      # servidor (por SSH, o por túnel SSH con un cliente gráfico) pero NUNCA
      # desde internet. Sin el prefijo, Docker publica en 0.0.0.0 y expone la
      # base al mundo, y ufw no lo impide porque Docker escribe sus reglas en
      # iptables por debajo del firewall.
      #
      # DB_HOST_PORT, no DB_PORT: en el .env de Laravel DB_PORT es el puerto con
      # el que la app se conecta a la base por la red interna (siempre 3306).
      # Reutilizar ese nombre acá rompería la conexión al cambiar el publish.
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rrhh

volumes:
  dbdata:

networks:
  rrhh:
    driver: bridge
